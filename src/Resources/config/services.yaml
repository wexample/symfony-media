services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyMedia\:
        resource: '../../{Repository,Security,Service}'

    Wexample\SymfonyMedia\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']

    Wexample\SymfonyMedia\Api\Controller\:
        resource: '../../Api/Controller/'
        tags: ['controller.service_arguments']

    # A media described for the engines, inside an entity's schema.org data.
    Wexample\SymfonyMedia\Normalizer\:
        resource: '../../Normalizer/*'
        tags: ['serializer.normalizer']

    Wexample\SymfonyMedia\Api\Normalizer\:
        resource: '../../Api/Normalizer/*'
        tags: ['serializer.normalizer']
